[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arca-engine"
version = "0.1.0.dev0"
description = "Motor local da ARCA (Arquivo de Recursos, Conhecimento e Autonomia)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psutil>=6.0",
  "libzim>=3.4,<4",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12.0"]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "pyinstaller>=6.10",
]

[project.scripts]
arca-engine = "arca_engine.__main__:main"

[tool.setuptools.packages.find]
include = ["arca_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
